name: V2 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # These are throwaway CI-only values, never institutional credentials.
    env:
      V2_BOOTSTRAP_DATABASE_URL: postgresql+psycopg://postgres:disposable-ci-admin@127.0.0.1:5432/cuny_advisor_v2_test
      V2_MIGRATION_PASSWORD: disposable-ci-migration
      V2_RUNTIME_PASSWORD: disposable-ci-runtime
      V2_MIGRATION_DATABASE_URL: postgresql+psycopg://v2_migrator:disposable-ci-migration@127.0.0.1:5432/cuny_advisor_v2_test
      V2_DATABASE_URL: postgresql+psycopg://v2_runtime:disposable-ci-runtime@127.0.0.1:5432/cuny_advisor_v2_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cuny_advisor_v2_test
          POSTGRES_PASSWORD: disposable-ci-admin
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cuny_advisor_v2_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.bootstrap_local
      - run: python -m alembic upgrade head
      - run: python -m pytest -q -m postgres -rs
      - run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
